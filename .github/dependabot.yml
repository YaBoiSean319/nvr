# Actions are pinned to commit SHAs (#274); Dependabot proposes the updates, keeping the version comments current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Python packages: the direct, pinned ones are in requirements.in and requirements-dev.in; the hashed lock (requirements.txt, requirements-dev.txt) is made by
  # scripts/lock-requirements.sh, and tests/test_requirements_lock.py fails a pull request that changes one without the other.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # The base images in the Dockerfile and the tunnel images in the remote-access overlays are pinned by digest (#384, #385): Dependabot proposes
  # the new digest and version together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
  # The web interface's packages and the root test packages (Playwright), one pull request a week each.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ["*"]
