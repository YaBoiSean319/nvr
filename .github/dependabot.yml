# Actions are pinned to commit SHAs (#274); Dependabot proposes the updates, keeping the version comments current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Python packages: the direct, pinned ones are in requirements.in and requirements-dev.in; the hashed lock (requirements.txt, requirements-dev.txt) is made by
  # scripts/lock-requirements.sh, and tests/test_requirements_lock.py fails a pull request that changes one without the other.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
