name: NVR checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mediamtx:
        image: bluenviron/mediamtx:1.21.0
        ports:
          - 8554:8554
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              install --no-install-recommends -y ffmpeg; then
              timeout 180s sudo apt-get \
                -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
              sudo apt-get \
                -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                install --no-install-recommends -y ffmpeg
            fi
          fi
          ffmpeg -version >/dev/null
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the browser interface
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Start simulated RTSP camera
        run: |
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -t 600 -an \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-test \
            >/tmp/nvr-browser-rtsp-publisher.log 2>&1 &
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -f lavfi -i sine=frequency=440:sample_rate=16000 -t 600 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 -c:a aac -b:a 32k \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-audio \
            >/tmp/nvr-browser-rtsp-publisher-audio.log 2>&1 &
          for attempt in $(seq 1 30); do
            if ffprobe -v error -rtsp_transport tcp -show_entries stream=codec_type \
              -of csv=p=0 rtsp://127.0.0.1:8554/nvr-test | grep -q video; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nvr-browser-rtsp-publisher.log
          exit 1
      - name: Run authenticated camera administration browser journeys
        run: npm run test:browser
        env:
          NVR_BROWSER_REPORT_PRIVACY_SENTINEL: nvr-camera-browser-report-privacy-sentinel-v1
      - name: Validate browser report privacy
        id: report-privacy
        if: always()
        env:
          NVR_BROWSER_REPORT_PRIVACY_SENTINEL: nvr-camera-browser-report-privacy-sentinel-v1
        run: node tests/browser/validate_acceptance_report_privacy.cjs
      - name: Retain browser acceptance evidence and failure media
        if: always() && steps.report-privacy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: camera-admin-browser-acceptance
          path: test-results/
          if-no-files-found: warn

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mediamtx:
        image: bluenviron/mediamtx:1.21.0
        ports:
          - 8554:8554
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              install --no-install-recommends -y ffmpeg; then
              timeout 180s sudo apt-get \
                -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
              sudo apt-get \
                -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                install --no-install-recommends -y ffmpeg
            fi
          fi
          ffmpeg -version >/dev/null
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start simulated RTSP camera
        run: |
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -t 600 -an \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-test \
            >/tmp/nvr-rtsp-publisher.log 2>&1 &
          nohup ffmpeg -re -f lavfi -i testsrc=size=320x240:rate=10 -f lavfi -i sine=frequency=440:sample_rate=16000 -t 600 \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -tune zerolatency -g 10 -c:a aac -b:a 32k \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/nvr-audio \
            >/tmp/nvr-rtsp-publisher-audio.log 2>&1 &
          for attempt in $(seq 1 30); do
            if ffprobe -v error -rtsp_transport tcp -show_entries stream=codec_type \
              -of csv=p=0 rtsp://127.0.0.1:8554/nvr-test | grep -q video; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nvr-rtsp-publisher.log
          exit 1
      - name: Run API and media tests
        env:
          NVR_RTSP_TEST_URL: rtsp://127.0.0.1:8554/nvr-test
          NVR_RTSP_AUDIO_TEST_URL: rtsp://127.0.0.1:8554/nvr-audio
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check browser JavaScript
        run: node --check app/static/app.js
      - name: Typecheck and build the browser interface
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Test workspace layout behavior
        run: node --test tests-js/*.test.cjs
      - name: Validate Compose configuration
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.discovery.yaml config -q
      - name: Build container image
        run: docker build --tag ghcr.io/yaboisean319/nvr:edge .
      - name: Benchmark and validate bundled CPU detection model
        run: docker run --rm ghcr.io/yaboisean319/nvr:edge python -m scripts.benchmark_ai
      - name: Smoke test Compose health and persistence
        run: |
          NVR_PORT=8080 docker compose up --pull never -d
          NVR_CI_TEST_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export NVR_CI_TEST_PASSWORD
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = "http://127.0.0.1:8080"

          def get_json(path):
              with urllib.request.urlopen(base + path, timeout=3) as response:
                  return response.status, json.load(response)

          for _ in range(40):
              try:
                  get_json("/healthz")
                  break
              except Exception:
                  time.sleep(1)
          else:
              import subprocess
              subprocess.run(["docker", "compose", "ps", "-a"], check=False)
              subprocess.run(["docker", "compose", "logs", "--no-color", "nvr"], check=False)
              raise RuntimeError("Compose service did not become healthy")

          status, setup = get_json("/api/setup/status")
          assert status == 200 and setup["setup_required"]
          payload = json.dumps({"username": "ci-admin", "password": os.environ["NVR_CI_TEST_PASSWORD"]}).encode()
          request = urllib.request.Request(
              base + "/api/setup/admin", data=payload,
              headers={"Content-Type": "application/json"}, method="POST"
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 201
          PY
          docker compose restart nvr
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:8080"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=3):
                      pass
                  with urllib.request.urlopen(base + "/api/setup/status", timeout=3) as response:
                      setup = json.load(response)
                  assert not setup["setup_required"], "Administrator state was lost on restart"
                  break
              except Exception:
                  time.sleep(1)
          else:
              import subprocess
              subprocess.run(["docker", "compose", "ps", "-a"], check=False)
              subprocess.run(["docker", "compose", "logs", "--no-color", "nvr"], check=False)
              raise RuntimeError("Compose service did not recover with persisted state")
          PY
      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yaboisean319/nvr
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
