name: Mobile app

# The native app (#140): it builds for both platforms, and the Android build is started in an emulator against a real NVR as a smoke test.
# Store signing and publishing are not here: they are post-merge steps (docs/mobile-app.md).

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'web/src/native/**', 'tests/browser/native*', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'web/src/native/**', 'tests/browser/native*', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install the app's dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Copy the web assets and plugins into the Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvr-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the app's dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Copy the web assets and plugins into the iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Build for the iOS simulator
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d ios/build/Build/Products/Debug-iphonesimulator/App.app

  android-emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the NVR
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Start the NVR where the emulator can reach it
        run: |
          mkdir -p /tmp/nvr-smoke/recordings
          NVR_DB_PATH=/tmp/nvr-smoke/state.sqlite3 NVR_RECORDINGS_PATH=/tmp/nvr-smoke/recordings NVR_CREDENTIAL_KEY_PATH=/tmp/nvr-smoke/credentials.key \
            nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8765 >/tmp/nvr-smoke/server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8765/healthz && exit 0
            sleep 1
          done
          cat /tmp/nvr-smoke/server.log
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nvr-debug-apk
          path: apk
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 mobile/smoke/smoke.py apk/app-debug.apk http://10.0.2.2:8765 "Create the administrator account"
      - name: Server log
        if: failure()
        run: cat /tmp/nvr-smoke/server.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: smoke-screens
          path: smoke-*.png
          if-no-files-found: ignore

  # The existing browser journeys, run as the app runs them: its user agent and a stand-in for Capacitor's bridge (NVR_APP_MODE, see tests/browser/helpers.cjs).
  # Journeys that are about the installable web app or need the simulated camera are left to the main workflow.
  web-in-app-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Run the journeys as the app
        run: npm run test:browser -- tests/browser/shell.spec.cjs tests/browser/alarms.spec.cjs tests/browser/settings.spec.cjs tests/browser/rules.spec.cjs tests/browser/access-grants.spec.cjs tests/browser/native-app.spec.cjs
        env:
          NVR_APP_MODE: '1'
          NVR_BROWSER_REPORT_PRIVACY_SENTINEL: nvr-camera-browser-report-privacy-sentinel-v1
