name: NVR release

# Push a tag like v1.2.0 on a commit of main that passed the checks. This publishes the image as ghcr.io/yaboisean319/nvr:1.2.0 and creates the release the NVR's
# Settings, Updates page reads: its notes, and a line saying which database schema the release needs so the page can say whether it migrates.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a commit of main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require the tag to match the application version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python3 -c 'import re,pathlib; print(re.search(r"APP_VERSION = \"([^\"]+)\"", pathlib.Path("app/version.py").read_text()).group(1))')"
          test "$expected" = "$actual" || { echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $actual in app/version.py"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yaboisean319/nvr
          tags: |
            type=semver,pattern={{version}}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          schema="$(PYTHONPATH=. python3 -c 'from app.migrations import latest_version; print(latest_version())')"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
          printf '\n<!-- nvr-release: {"schema_version": %s} -->\n' "$schema" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
