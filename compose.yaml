services:
  nvr:
    build: .
    restart: unless-stopped
    ports:
      - "${NVR_PORT:-8080}:8080"
    environment:
      NVR_DB_PATH: /data/nvr.sqlite3
      NVR_RECORDINGS_PATH: /recordings
      NVR_CREDENTIAL_KEY_PATH: /secrets/credentials.key
      NVR_SESSION_HOURS: ${NVR_SESSION_HOURS:-12}
      NVR_COOKIE_SECURE: ${NVR_COOKIE_SECURE:-false}
      NVR_PUBLIC_URL: ${NVR_PUBLIC_URL:-}
      NVR_OIDC_TENANT_ID: ${NVR_OIDC_TENANT_ID:-}
      NVR_OIDC_CLIENT_ID: ${NVR_OIDC_CLIENT_ID:-}
      NVR_OIDC_CLIENT_SECRET: ${NVR_OIDC_CLIENT_SECRET:-}
      NVR_OIDC_SESSION_SECRET: ${NVR_OIDC_SESSION_SECRET:-}
      NVR_OIDC_ADMIN_ROLES: ${NVR_OIDC_ADMIN_ROLES:-}
      NVR_OIDC_OPERATOR_ROLES: ${NVR_OIDC_OPERATOR_ROLES:-}
    volumes:
      - nvr-data:/data
      - nvr-secrets:/secrets
      - nvr-recordings:/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nvr-data:
  nvr-secrets:
  nvr-recordings:
