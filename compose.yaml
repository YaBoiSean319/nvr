services:
  nvr:
    image: ghcr.io/yaboisean319/nvr:edge
    pull_policy: always
    # Camera discovery, ONVIF event delivery, and stream access use the host's
    # camera-network interfaces directly. This is the tested deployment mode.
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NVR_LISTEN_PORT: ${NVR_PORT:-8280}
      NVR_DB_PATH: /data/nvr.sqlite3
      NVR_RECORDINGS_PATH: /recordings
      NVR_STORAGE_VOLUMES: '{"default":"","archive":"archive"}'
      NVR_CREDENTIAL_KEY_PATH: /secrets/credentials.key
      NVR_SESSION_HOURS: ${NVR_SESSION_HOURS:-12}
      NVR_COOKIE_SECURE: ${NVR_COOKIE_SECURE:-false}
      NVR_PUBLIC_URL: ${NVR_PUBLIC_URL:-}
      NVR_OIDC_TENANT_ID: ${NVR_OIDC_TENANT_ID:-}
      NVR_OIDC_CLIENT_ID: ${NVR_OIDC_CLIENT_ID:-}
      NVR_OIDC_CLIENT_SECRET: ${NVR_OIDC_CLIENT_SECRET:-}
      NVR_OIDC_SESSION_SECRET: ${NVR_OIDC_SESSION_SECRET:-}
      NVR_OIDC_ADMIN_ROLES: ${NVR_OIDC_ADMIN_ROLES:-}
      NVR_OIDC_OPERATOR_ROLES: ${NVR_OIDC_OPERATOR_ROLES:-}
      NVR_DISCOVERY_INTERFACE: ${NVR_DISCOVERY_INTERFACE:-}
      # Encrypted configuration backups (database and credential key, never footage).
      # Backups stay disabled until a passphrase of at least 16 characters is set.
      NVR_BACKUP_PASSPHRASE: ${NVR_BACKUP_PASSPHRASE:-}
      NVR_BACKUP_PASSPHRASE_FILE: ${NVR_BACKUP_PASSPHRASE_FILE:-}
      NVR_BACKUP_PATH: /backups
      NVR_BACKUP_KEEP: ${NVR_BACKUP_KEEP:-14}
    volumes:
      - nvr-data:/data
      - nvr-secrets:/secrets
      - nvr-recordings:/recordings
      - nvr-archive:/recordings/archive
      # Point this at storage on a different disk or host, for example
      # "- /mnt/offsite/nvr-backups:/backups", so a host or disk loss does not take the backups too.
      - nvr-backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('NVR_LISTEN_PORT','8280')+'/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nvr-data:
  nvr-secrets:
  nvr-recordings:
  nvr-archive:
  nvr-backups:
