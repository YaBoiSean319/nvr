<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Workplace NVR</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; --bg:#f4f6f8; --panel:#fff; --ink:#18212b; --muted:#586575; --accent:#155eef; }
    @media (prefers-color-scheme:dark) { :root { --bg:#10151c; --panel:#1b232d; --ink:#edf2f7; --muted:#a7b2c0; --accent:#8ab4ff; } }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh; display:grid; place-items:center; padding:1.5rem }
    main { width:min(100%, 34rem); background:var(--panel); padding:clamp(1.5rem,5vw,3rem); border-radius:1rem; box-shadow:0 1rem 3rem #0002 }
    h1 { margin-top:0; font-size:1.8rem } p { color:var(--muted) } label { display:block; margin-top:1rem; font-weight:600 }
    input { width:100%; padding:.75rem; margin-top:.35rem; border:1px solid #8793a1; border-radius:.4rem; font:inherit; color:var(--ink); background:var(--panel) }
    button { margin-top:1.25rem; padding:.75rem 1rem; border:0; border-radius:.45rem; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer }
    button:focus-visible,input:focus-visible { outline:3px solid #f5a623; outline-offset:2px } [role=alert] { color:#b42318; min-height:1.5em }
    dl { display:grid; grid-template-columns:1fr auto; gap:.5rem; border-top:1px solid #8793a155; padding-top:1rem } dt { color:var(--muted) } dd { margin:0; font-weight:600 }
    .hidden { display:none } .badge { color:#087443 }
  </style>
</head>
<body>
  <main>
    <h1>Workplace NVR</h1>
    <section id="setup" class="hidden">
      <h2>Secure first-run setup</h2>
      <p>Create the local emergency administrator. This setup closes permanently after the first account is created.</p>
      <form id="setup-form">
        <label for="setup-user">Administrator username</label><input id="setup-user" autocomplete="username" minlength="3" maxlength="128" required>
        <label for="setup-pass">Password</label><input id="setup-pass" type="password" autocomplete="new-password" minlength="14" required aria-describedby="password-help">
        <p id="password-help">At least 14 characters with a letter and a number.</p>
        <button>Create administrator</button>
      </form>
    </section>
    <section id="login" class="hidden">
      <h2>Sign in</h2>
      <form id="login-form">
        <label for="login-user">Username</label><input id="login-user" autocomplete="username" required>
        <label for="login-pass">Password</label><input id="login-pass" type="password" autocomplete="current-password" required>
        <button>Sign in</button>
      </form>
    </section>
    <section id="status" class="hidden">
      <h2>System status</h2><p class="badge">● System healthy</p>
      <dl id="status-list"></dl>
      <button id="logout">Sign out</button>
    </section>
    <p id="message" role="alert" aria-live="polite"></p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
