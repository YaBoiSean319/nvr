# Only the linter is configured here; the application is run from requirements.txt.
[tool.ruff]
target-version = "py314"
extend-exclude = ["web", "mobile", "node_modules"]

[tool.ruff.lint]
# Small on purpose: things that are wrong, not style. F is pyflakes (unused imports and variables, undefined names); B904 keeps the cause of a
# re-raised error explicit; B006 catches mutable default arguments; RUF006 catches a background task nobody keeps a reference to, which the event
# loop may drop before it has run. The "# noqa: BLE001" comments that explain broad excepts are kept as documentation.
select = ["F", "B904", "B006", "RUF006"]
