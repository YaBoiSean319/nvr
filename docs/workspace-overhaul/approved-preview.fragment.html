  <header class="n-topbar">

        <div class="n-small n-muted" style="display:flex;gap:15px;flex-wrap:wrap;margin-top:5px"><span>▰ Recorded</span><span style="color:var(--n-warn)">│ Motion</span><span>Empty track · No recording</span></div>
      </section>
      <footer class="n-footer"><span class="n-chip"><span class="n-dot"></span>Recorder online</span><button type="button" data-action="alerts" id="n-alert-count">1 camera offline</button><span class="n-spacer"></span><span id="n-context">Live · Auto quality</span><span>Design preview · Sample frames</span></footer>
    </main>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('nvr-workspace-preview');
    const $=s=>root.querySelector(s),$$=s=>Array.from(root.querySelectorAll(s));
    const cameras=[['Atrium','hall'],['East corridor','corridor'],['Front entrance','hall'],['North parking','parking'],['Delivery entrance','hall'],['Elevator lobby','hall'],['Garden entrance','hall'],['Loading area','parking'],['Reception','hall'],['South corridor','corridor'],['South parking','parking'],['Stairwell east','corridor'],['Stairwell west','corridor'],['Storage corridor','corridor'],['West entrance','hall'],['West parking','parking']].map((c,i)=>({id:i,name:c[0],scene:c[1],offline:i===3}));
    const state={mode:'live',browse:'cameras',live:[0,1,2,3],playback:[0,1,2],active:0,focus:null,manual:false,quality:0,time:872,playing:false,speed:1,markin:null,markout:null,edit:0,editTab:'Recording',settings:'General',saved:false,jobs:1};
    const selected=()=>state.mode==='playback'?state.playback:state.live;
    const icons=()=>{$$('button').forEach(b=>b.classList.add('cursor-interaction'));if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}})};
    const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
    const time=()=>{const m=Math.floor(state.time/60),s=state.time%60;return `9:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} AM`};
    const notice=t=>{const n=$('#n-notice');n.textContent=t;n.hidden=false;clearTimeout(state.noticeTimer);state.noticeTimer=setTimeout(()=>n.hidden=true,3500)};
    function geometry(n){if(!n)return [1,1];if(n===1)return [1,1];if(n===2)return [2,1];if(n<=4)return [2,2];if(n<=6)return [3,2];if(n<=9)return [3,3];if(n<=12)return [4,3];return [4,4]}
    function renderBrowser(){
      const q=$('#n-search').value.toLowerCase(),list=$('#n-camera-list');
      $('#n-browser-tabs').hidden=state.mode==='settings';
      if(state.mode==='settings'){list.innerHTML='<div class="n-settingsnav">'+['General','Appearance','Users & access','Recording & storage','Notifications','Integrations','Diagnostics'].map(x=>`<button type="button" data-setting="${x}" class="${state.settings===x?'selected':''}">${x}</button>`).join('')+'</div>';return}
      $$('[data-browse]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.browse===state.browse)));
      if(state.browse==='views'){list.innerHTML=['Main building','Entrances',...(state.saved?['My workspace']:[])].map((n,i)=>`<button type="button" class="n-camera" data-view="${i}">${icon('layout-grid')}<span>${n}</span><span class="n-muted n-small">${i?'Personal':'Shared'}</span></button>`).join('');return}
      if(state.browse==='groups'){list.innerHTML=['Entrances','Parking','Interior'].map((n,i)=>`<button type="button" class="n-camera" data-group="${i}">${icon('folder')}<span>${n}</span><span class="n-muted">${[4,4,8][i]}</span></button>`).join('');return}
      const filtered=cameras.filter(c=>c.name.toLowerCase().includes(q));
      list.innerHTML='<div class="n-group">Main building</div>'+filtered.map(c=>{const on=state.mode==='cameras'?state.edit===c.id:selected().includes(c.id);return `<button type="button" class="n-camera ${on?'selected':''}" data-camera="${c.id}" aria-pressed="${on}" draggable="true"><span class="n-check">${on?'✓':''}</span><span>${c.name}</span><span class="n-dot ${c.offline?'warn':''}" aria-label="${c.offline?'Offline':'Online'}"></span></button>`}).join('')+(filtered.length?'':'<div class="n-small n-muted" style="padding:10px">No cameras found</div>');
    }
    const scene=c=>`<div class="n-scene ${c.scene}" aria-hidden="true"><div class="n-door"></div><div class="n-window"></div><div class="n-bench"></div></div>`;
    function renderGrid(){
      const ids=selected(),[cols,rows]=state.manual?[2,2]:geometry(ids.length),shown=state.focus===null?ids:ids.filter(x=>x===state.focus);
      $('#n-grid').style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;$('#n-grid').classList.toggle('n-focused',state.focus!==null);
      $('#n-selection-count').textContent=`${ids.length} camera${ids.length===1?'':'s'}`;
      $('#n-layout-label').innerHTML=icon('layout-grid')+(state.focus!==null?'Restore view':`${state.manual?'Manual':'Auto'} · ${cols} × ${rows}`);
      let html=shown.map(id=>{const c=cameras[id],gap=state.mode==='playback'&&id===1&&state.time>780&&state.time<990,failed=state.mode==='live'&&c.offline;
        return `<article class="n-tile ${state.active===id?'active':''} ${failed||gap?'n-offline':''}" data-tile="${id}" aria-label="${c.name}${failed?' offline':gap?' no recording':''}">${scene(c)}<div class="n-tilehead"><span class="n-dot ${failed||gap?'warn':''}"></span><span>${c.name}</span><button type="button" data-remove="${id}" aria-label="Remove ${c.name}">${icon('x')}</button></div>${failed||gap?`<div class="n-failure">${icon(failed?'wifi-off':'film')}<span>${failed?'Camera offline':'No video available'}</span><span class="n-small">Last frame · ${failed?'9:12:08 AM':'9:12:59 AM'}</span>${failed?`<button type="button" data-retry="${id}">Retry</button>`:''}</div>`:''}<div class="n-tiletools"><button type="button" data-enlarge="${id}" aria-label="${state.focus===id?'Restore':'Enlarge'} ${c.name}">${icon(state.focus===id?'minimize-2':'maximize-2')}</button><button type="button" data-snapshot="${id}" aria-label="Snapshot ${c.name}">${icon('camera')}</button>${state.mode==='live'?`<button type="button" data-playback="${id}" aria-label="Open ${c.name} in Playback">${icon('history')}</button>`:''}<button type="button" data-audio="${id}" aria-label="Toggle audio for ${c.name}" aria-pressed="false">${icon('volume-x')}</button></div><div class="n-tilefoot"><span>${state.mode==='live'?(failed?'Last received 9:12:08 AM':'Oct 22 · 9:14:32 AM'):time()}</span><span class="n-spacer"></span><span class="n-framelabel">Sample frame</span></div></article>`}).join('');
      if(!ids.length)html='<div class="n-empty n-emptyall">'+icon('video')+'<span>Select cameras to start viewing</span><span class="n-small">Your layout adjusts automatically</span></div>';
      else if(state.focus===null&&ids.length<cols*rows)html+=Array.from({length:cols*rows-ids.length},(_,i)=>`<div class="n-empty">${i===0?`<button type="button" data-action="addcamera">${icon('plus')}Add camera</button>`:''}</div>`).join('');
      $('#n-grid').innerHTML=html;renderTracks();icons();
    }
    function renderTracks(){
      $('#n-time').textContent=`Oct 22, 2026 · ${time()}`;$('#n-scrub').value=state.time;
      $('#n-tracks').innerHTML=state.playback.map((id,i)=>`<div class="n-trackrow"><span class="n-tracklabel">${cameras[id].name}</span><div class="n-track">${(i===1?[[0,43],[55,45]]:[[0,100]]).map(([a,b])=>`<span class="n-recorded" style="left:${a}%;width:${b}%"></span>`).join('')}<span class="n-motion" style="left:${24+i*8}%"></span><span class="n-motion" style="left:${69-i*5}%"></span><span class="n-playhead" style="left:${state.time/18}%"></span></div></div>`).join('');
    }
    function renderAdmin(){
      const c=cameras[state.edit];
      if(state.mode==='settings'){
        $('#n-admin').innerHTML=`<div><div class="n-sectiontitle">${state.settings}</div><div class="n-muted n-small" style="margin-bottom:20px">System settings</div>${state.settings==='General'?'<label class="n-field">System name<input value="Workplace NVR"></label><label class="n-field">Timezone<select><option>Eastern Time — Indianapolis</option><option>UTC</option></select></label><label class="n-field">Time format<select><option>12-hour</option><option>24-hour</option></select></label>':state.settings==='Appearance'?'<label class="n-field">Appearance<select id="n-theme-select"><option value="dark">Dark</option><option value="light">Light</option></select></label><label class="n-field">Interface density<select><option>Comfortable</option><option>Compact</option></select></label>':state.settings==='Recording & storage'?'<div class="n-detailrow"><span>Recording storage</span><span>Healthy</span></div><div class="n-detailrow"><span>Retention policy</span><span>30 days</span></div><div class="n-detailrow"><span>Evidence holds</span><span>Protected</span></div>':state.settings==='Diagnostics'?'<div class="n-detailrow"><span>Recorder service</span><span>Online</span></div><div class="n-detailrow"><span>Capture window</span><span>Inactive</span></div><button type="button" class="n-bordered" data-action="diagnostics" style="margin-top:15px">Download sanitized diagnostics</button>':`<div class="n-detailrow"><span>${state.settings==='Users & access'?'Administrator access':state.settings==='Notifications'?'In-app alerts':'API access'}</span><span>Enabled</span></div><div class="n-detailrow"><span>${state.settings==='Users & access'?'Operator role':state.settings==='Notifications'?'Webhook delivery':'Single sign-on'}</span><span>Configured</span></div>`}<button type="button" class="n-primary" data-action="save" style="margin-top:16px">Save changes</button></div>`;return;
      }
      $('#n-admin').innerHTML=`<div class="n-inventory">${cameras.slice(0,8).map(x=>`<button type="button" data-edit="${x.id}" class="${state.edit===x.id?'selected':''}"><span class="n-dot ${x.offline?'warn':''}"></span><span>${x.name}</span><span class="n-muted n-small">${x.offline?'Offline':'Healthy'}</span></button>`).join('')}</div><section><div class="n-sectiontitle">${c.name}</div><span class="n-small n-muted">Camera configuration</span><div class="n-editnav">${['Recording','Schedule','Zones','Connection'].map(t=>`<button type="button" data-edit-tab="${t}" aria-pressed="${state.editTab===t}">${t}</button>`).join('')}</div>${state.editTab==='Recording'?'<label class="n-field">Recording mode<select><option>Motion only</option><option>Continuous</option><option>Scheduled</option></select></label><label class="n-field">Retention<input type="number" min="1" value="30" aria-label="Retention in days"><span class="n-muted">Days · subject to storage policy</span></label><label class="n-field">Audio<select><option>Disabled</option><option>Enabled</option></select></label><details style="font-size:12px;margin:18px 0"><summary>Advanced recording options</summary><div class="n-detailrow"><span>Pre-event buffer</span><span>5 seconds</span></div><div class="n-detailrow"><span>Post-event buffer</span><span>15 seconds</span></div></details>':state.editTab==='Schedule'?'<div class="n-small n-muted">Weekly recording schedule</div><div class="n-schedule">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="n-day"><span>${d}</span><button type="button" data-day="${d}">Motion · all day</button></div>`).join('')+'</div><div class="n-scheduleaxis"><span>12 AM</span><span>12 PM</span><span>12 AM</span></div>':state.editTab==='Zones'?`<div class="n-small n-muted">Motion detection area</div><div class="n-zonepreview">${scene(c)}<div class="n-zone">Entrance zone</div></div><button type="button" class="n-bordered" data-action="zone">Edit zone</button><div class="n-small n-muted" style="margin:9px 0">Visual zone editor</div>`:'<label class="n-field">Camera address<input value="camera-entrance.example.invalid"></label><label class="n-field">Username<input value="camera-user" autocomplete="off"></label><label class="n-field">Password<input type="password" placeholder="Unchanged" autocomplete="new-password"></label><button type="button" class="n-bordered" data-action="testconnection">Test connection</button>'}<button type="button" class="n-primary" data-action="save" style="margin-top:12px">Save changes</button></section>`;
    }
    function render(){
      const viewing=state.mode==='live'||state.mode==='playback';
      if(viewing&&!selected().includes(state.active))state.active=selected()[0]??null;
      $$('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
      $('#n-grid').hidden=!viewing;$('#n-admin').hidden=viewing;$('#n-timeline').hidden=state.mode!=='playback';
      $('#n-worktitle').textContent=state.mode==='live'?'Main building':state.mode==='playback'?'Investigation':state.mode==='cameras'?'Camera inventory':'Administration';
      ['#n-save-view','#n-layout-label','#n-quality','#n-selection-count'].forEach(s=>$(s).hidden=!viewing);
      $('#n-context').textContent=state.mode==='live'?'Live · Auto quality':state.mode==='playback'?'Synchronized playback · Eastern Time':'Administrator';
      $('#n-alert-count').textContent=cameras.some(c=>c.offline)?'1 camera offline':'All cameras healthy';
      renderBrowser();if(viewing)renderGrid();else renderAdmin();icons();
    }
    function toggleCamera(id){if(state.mode==='cameras'){state.edit=id;render();return}if(state.mode==='settings')return;const ids=selected(),i=ids.indexOf(id);if(i>=0){ids.splice(i,1);if(state.focus===id)state.focus=null;if(state.active===id)state.active=ids[0]??null}else{if(ids.length>=16){notice('This workspace supports up to 16 cameras. Remove one to add another.');return}ids.push(id);state.active=id}render()}
    function drawer(type){const d=$('#n-drawer');d.hidden=false;
      const head=t=>`<div class="n-drawerhead"><span>${t}</span><button type="button" class="n-icon" data-action="closedrawer" aria-label="Close panel">${icon('x')}</button></div>`;
      if(type==='export')d.innerHTML=head('Export footage')+`<div class="n-detailrow"><span>Cameras</span><span>${state.playback.length} selected</span></div><div class="n-detailrow"><span>Range</span><span>${state.markin===null?'9:14:00 AM':formatSeconds(state.markin)} – ${state.markout===null?'9:16:00 AM':formatSeconds(state.markout)}</span></div><label class="n-field" style="margin-top:16px">Export contents<select><option>Individual videos + shared grid</option><option>Individual videos</option><option>Shared grid</option></select></label><label class="n-field">Filename<input value="Incident-review"></label><div class="n-small n-muted" style="margin-bottom:16px">One ZIP · original timestamps · current grid arrangement</div><button type="button" class="n-primary" data-action="queueexport">Create export</button>`;
      else if(type==='jobs')d.innerHTML=head('Export jobs')+`<div class="n-job"><div>Incident review</div><div class="n-small n-muted">${state.jobs>1?'Queued':'Preparing videos'} · ${state.playback.length} cameras</div><div class="n-progress"><span style="width:${state.jobs>1?'8':'62'}%"></span></div><div class="n-small n-muted">${state.jobs>1?'Waiting for worker':'62% · export continues in background'}</div></div><div class="n-small n-muted">Sample job status</div>`;
      else if(type==='alerts')d.innerHTML=head('Operational status')+`<div class="n-detailrow"><span>Recorder service</span><span style="color:var(--n-good)">Online</span></div><div class="n-detailrow"><span>Recording writes</span><span style="color:var(--n-good)">Healthy</span></div><div class="n-detailrow"><span>Storage</span><span style="color:var(--n-good)">Healthy</span></div>${cameras[3].offline?'<div class="n-job"><div>North parking · Offline</div><div class="n-small n-muted" style="margin:7px 0">Video unavailable since 9:12 AM. Automatic reconnect pending.</div><button type="button" class="n-bordered" data-retry="3">Retry connection</button></div>':'<div class="n-job">All cameras connected</div>'}`;
      else if(type==='layout')d.innerHTML=head('Layout')+`<button type="button" data-layout="auto" aria-pressed="${!state.manual}">Auto — fit selected cameras</button><button type="button" data-layout="manual" aria-pressed="${state.manual}">Manual — 2 × 2</button><div class="n-small n-muted" style="margin-top:12px">Auto grows and shrinks with your selection.</div>`;
      else if(type==='saveview')d.innerHTML=head('Save view')+'<label class="n-field">View name<input id="n-view-name" value="My workspace"></label><label class="n-field">Visibility<select><option>Personal</option><option>Shared</option></select></label><button type="button" class="n-primary" data-action="confirmsaveview">Save view</button>';
      else if(type==='date')d.innerHTML=head('Jump to time')+'<label class="n-field">Date<input type="date" value="2026-10-22"></label><label class="n-field">Time<input type="time" id="n-jump-time" value="09:14:32" step="1"></label><button type="button" class="n-primary" data-action="jumptime">Go to time</button>';
      else if(type==='shortcuts')d.innerHTML=head('Keyboard shortcuts')+[['Space','Play / pause'],['← / →','Seek 10 seconds'],['I / O','Mark in / out'],['F','Enlarge active tile'],['Escape','Restore / close panel']].map(([a,b])=>`<div class="n-detailrow"><span>${b}</span><kbd>${a}</kbd></div>`).join('');
      icons();
    }
    const formatSeconds=s=>`9:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')} AM`;
    function mark(which){state[which]=state.time;if(state.markin!==null&&state.markout!==null&&state.markout<=state.markin){notice('Mark out must be later than mark in.');state.markout=null;return}$('#n-mark-in').setAttribute('aria-pressed',String(state.markin!==null));$('#n-mark-out').setAttribute('aria-pressed',String(state.markout!==null));if(state.markin!==null&&state.markout!==null)drawer('export');else notice(which==='markin'?'In point set':'Out point set')}
    function play(){state.playing=!state.playing;$('#n-play').setAttribute('aria-label',state.playing?'Pause':'Play');$('#n-play').innerHTML=icon(state.playing?'pause':'play');icons()}
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b){const t=e.target.closest('[data-tile]');if(t){state.active=Number(t.dataset.tile);$$('[data-tile]').forEach(x=>x.classList.toggle('active',Number(x.dataset.tile)===state.active))}return}
      if(b.dataset.mode){state.mode=b.dataset.mode;state.focus=null;state.active=selected()[0]??null;$('#n-drawer').hidden=true;render();return}
      if(b.dataset.camera!==undefined){toggleCamera(Number(b.dataset.camera));return}
      if(b.dataset.remove!==undefined){toggleCamera(Number(b.dataset.remove));return}
      if(b.dataset.enlarge!==undefined){const id=Number(b.dataset.enlarge);state.focus=state.focus===id?null:id;renderGrid();return}
      if(b.dataset.playback!==undefined){const id=Number(b.dataset.playback);state.mode='playback';if(!state.playback.includes(id)&&state.playback.length<16)state.playback.push(id);state.active=id;state.focus=null;render();return}
      if(b.dataset.retry!==undefined){const id=Number(b.dataset.retry);b.textContent='Reconnecting…';b.disabled=true;setTimeout(()=>{cameras[id].offline=false;$('#n-drawer').hidden=true;render();notice('Sample camera reconnected')},650);return}
      if(b.dataset.snapshot!==undefined){notice('Sample snapshot selected — production will download the displayed frame.');return}
      if(b.dataset.audio!==undefined){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.innerHTML=icon(on?'volume-2':'volume-x');notice(on?'Audio enabled for selected tile (preview)':'Audio muted');icons();return}
      if(b.dataset.browse){state.browse=b.dataset.browse;renderBrowser();icons();return}
      if(b.dataset.edit!==undefined){state.edit=Number(b.dataset.edit);render();return}
      if(b.dataset.editTab){state.editTab=b.dataset.editTab;renderAdmin();icons();return}
      if(b.dataset.setting){state.settings=b.dataset.setting;render();return}
      if(b.dataset.day){b.textContent=b.textContent.startsWith('Motion')?'Continuous · all day':'Motion · all day';return}
      if(b.dataset.layout){state.manual=b.dataset.layout==='manual';if(state.manual&&selected().length>4){state.manual=false;notice('A 2 × 2 layout holds four cameras. Auto keeps all selected cameras visible.')}$('#n-drawer').hidden=true;renderGrid();return}
      if(b.dataset.view!==undefined||b.dataset.group!==undefined){const ids=b.dataset.view!==undefined?Number(b.dataset.view)===0?[0,1,2,3]:[2,4,6,14]:Number(b.dataset.group)===0?[2,4,6,14]:Number(b.dataset.group)===1?[3,7,10,15]:[0,1,5,8,9,11,12,13];if(state.mode==='playback')state.playback=ids;else{if(state.mode!=='live')state.mode='live';state.live=ids}state.focus=null;render();return}
      const a=b.dataset.action;
      if(a==='layout'&&state.focus!==null){state.focus=null;renderGrid();return}
      if(['export','jobs','alerts','layout','saveview','date','shortcuts'].includes(a)){drawer(a);return}
      if(a==='closedrawer')$('#n-drawer').hidden=true;
      else if(a==='theme')root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
      else if(a==='sidebar')root.classList.toggle('n-sidebaropen');
      else if(a==='quality'){state.quality=(state.quality+1)%3;$('#n-quality').textContent='Quality · '+['Auto','Main','Sub'][state.quality]}
      else if(a==='save')notice('Changes saved in this design preview.');
      else if(a==='confirmsaveview'){state.saved=true;$('#n-drawer').hidden=true;notice('View saved in this design preview');renderBrowser();icons()}
      else if(a==='addcamera'){$('#n-search').focus();root.classList.add('n-sidebaropen')}
      else if(a==='play')play();
      else if(a==='prevevent'||a==='nextevent'){state.time=Math.max(0,Math.min(1800,state.time+(a==='prevevent'?-120:120)));renderGrid()}
      else if(a==='speed'){state.speed=state.speed===1?2:state.speed===2?4:1;b.textContent=state.speed+'×'}
      else if(a==='markin'||a==='markout')mark(a);
      else if(a==='queueexport'){state.jobs++;$('#n-job-count').textContent=state.jobs;$('#n-drawer').hidden=true;notice('Sample export queued. Continue reviewing footage.')}
      else if(a==='jumptime'){const parts=$('#n-jump-time').value.split(':').map(Number);if(parts[0]!==9||parts[1]>30){notice('This preview contains 9:00–9:30 AM sample footage.');return}state.time=parts[1]*60+(parts[2]||0);$('#n-drawer').hidden=true;renderGrid()}
      else if(a==='zone')notice('The production editor will support drawing and resizing zones directly on the frame.');
      else if(a==='testconnection')notice('Sample connection check passed.');
      else if(a==='diagnostics')notice('Production diagnostics will download with sensitive fields removed.');
    });
    root.addEventListener('dblclick',e=>{if(e.target.closest('button'))return;const t=e.target.closest('[data-tile]');if(t){const id=Number(t.dataset.tile);state.focus=state.focus===id?null:id;renderGrid()}});
    root.addEventListener('dragstart',e=>{const c=e.target.closest('[data-camera]');if(c)e.dataTransfer.setData('text/plain',c.dataset.camera)});
    root.addEventListener('dragover',e=>{if(e.target.closest('[data-tile]'))e.preventDefault()});
    root.addEventListener('drop',e=>{const tile=e.target.closest('[data-tile]');if(!tile)return;e.preventDefault();const id=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(id)||id<0||id>=cameras.length)return;const old=Number(tile.dataset.tile),ids=selected(),at=ids.indexOf(old),exists=ids.indexOf(id);if(at<0)return;if(exists>=0){ids[exists]=old;ids[at]=id}else ids[at]=id;state.active=id;render()});
    $('#n-search').addEventListener('input',()=>{renderBrowser();icons()});
    $('#n-scrub').addEventListener('input',e=>{state.time=Number(e.target.value);renderGrid()});
    root.addEventListener('change',e=>{if(e.target.id==='n-theme-select')root.dataset.theme=e.target.value});
    root.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='Escape'){state.focus=null;$('#n-drawer').hidden=true;if(state.mode==='live'||state.mode==='playback')renderGrid();return}if(e.key==='?'){drawer('shortcuts');return}if(e.key.toLowerCase()==='f'&&selected().length&&(state.mode==='live'||state.mode==='playback')){e.preventDefault();state.focus=state.focus===null?state.active:null;renderGrid()}if(state.mode!=='playback')return;if(e.key===' '){e.preventDefault();play()}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();state.time=Math.max(0,Math.min(1800,state.time+(e.key==='ArrowLeft'?-10:10)));renderGrid()}if(e.key.toLowerCase()==='i')mark('markin');if(e.key.toLowerCase()==='o')mark('markout')});
    setInterval(()=>{if(state.playing&&state.mode==='playback'){state.time=Math.min(1800,state.time+state.speed);if(state.time===1800){state.playing=false;$('#n-play').setAttribute('aria-label','Play');$('#n-play').innerHTML=icon('play')}renderGrid()}},1000);
    $$('button').forEach(b=>b.classList.add('cursor-interaction'));
    render();
  })();
  </script>
</div>
